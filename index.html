<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perdoni? ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#ffb6c1,#ffe4e1);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.box{
    text-align:center;
}

h1{
    color:#d63384;
    font-size:3em;
}

p{
    font-size:1.3em;
    margin-bottom:40px;
}

button{
    font-size:22px;
    padding:15px 35px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    transition:0.25s;
}

#yes{
    background:#28a745;
    color:white;
    margin-right:20px;
}

#no{
    background:#dc3545;
    color:white;
    position:absolute;
}
</style>
</head>

<body>

<div class="box">
    <h1>❤️ Mi perdoni? ❤️</h1>
    <p>Prometto di farmi perdonare con tante coccole 🥺</p>

    <button id="yes">Sì ❤️</button>
    <button id="no">No 😒</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

let scale = 1;

function moveButton(){

    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    // Il pulsante SI cresce
    scale += 0.15;
    yesBtn.style.transform = `scale(${scale})`;

    // Frasi divertenti
    const frasi = [
        "No 😒",
        "Sicura? 🤨",
        "Daiii 🥺",
        "Ripensaci ❤️",
        "Ma davvero? 😭",
        "Non fare così 😅",
        "Ti prego 🥹"
    ];

    noBtn.innerText = frasi[Math.floor(Math.random()*frasi.length)];
}

noBtn.addEventListener("mouseenter", moveButton);

noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton();
});

yesBtn.addEventListener("click", function(){

    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;background:#ffd6e7;font-family:Arial;">
        <h1 style="font-size:60px;color:#e91e63;">❤️ Lo sapevo! ❤️</h1>
        <h2>Grazie amore, non te ne pentirai 🥹</h2>
        <div style="font-size:90px;">🥰💖🌹🎉</div>
    </div>
    `;

});

moveButton();
</script>

</body>
</html>
